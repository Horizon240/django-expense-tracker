{% extends 'expenses/base.html' %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 420px;">
    <div class="card-header bg-white fw-bold">Create Account</div>
    <div class="card-body">
        <form method="POST" class="d-grid gap-3">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="small text-muted mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Login here</a>.</p>
    </div>
</div>
{% endblock %}
